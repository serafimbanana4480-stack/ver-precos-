<!DOCTYPE html>
<html>
<head>
    <title>System Health</title>
</head>
<body>
    <h1>🏥 System Health</h1>
    <table>
        <tr><td><strong>Status:</strong></td><td>{{ status }}</td></tr>
        <tr><td><strong>CPU Usage:</strong></td><td>{{ cpu_usage }}%</td></tr>
        <tr><td><strong>Memory Usage:</strong></td><td>{{ memory_usage }}%</td></tr>
        <tr><td><strong>Disk Usage:</strong></td><td>{{ disk_usage }}%</td></tr>
        <tr><td><strong>Uptime:</strong></td><td>{{ uptime }}</td></tr>
        <tr><td><strong>Timestamp:</strong></td><td>{{ timestamp }}</td></tr>
    </table>
</body>
</html>
