<!DOCTYPE html>
<html>
<head>
    <title>New Deal Found</title>
</head>
<body>
    <h1>🚗 New Deal Found!</h1>
    <table>
        <tr><td><strong>Vehicle:</strong></td><td>{{ brand }} {{ model }}</td></tr>
        <tr><td><strong>Price:</strong></td><td>€{{ price }}</td></tr>
        <tr><td><strong>Deal Score:</strong></td><td>{{ deal_score }}/10</td></tr>
        <tr><td><strong>Profit Potential:</strong></td><td>€{{ profit_potential }}</td></tr>
        <tr><td><strong>Location:</strong></td><td>{{ location }}</td></tr>
        <tr><td><strong>Source:</strong></td><td>{{ source }}</td></tr>
    </table>
    <p><a href="{{ url }}">View Listing</a></p>
</body>
</html>
