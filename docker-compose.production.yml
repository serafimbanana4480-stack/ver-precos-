version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autodeal
      POSTGRES_USER: autodeal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?err}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autodeal"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - autodeal-net

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - autodeal-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://autodeal:${DB_PASSWORD}@postgres:5432/autodeal}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?err}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - autodeal-net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: python main.py scheduler
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://autodeal:${DB_PASSWORD}@postgres:5432/autodeal}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - autodeal-net

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: python -m valuation.train
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://autodeal:${DB_PASSWORD}@postgres:5432/autodeal}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f models/best_model_carros.json"]
      interval: 60s
      timeout: 10s
      retries: 2
    restart: "no"
    networks:
      - autodeal-net

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - dashboard
    restart: unless-stopped
    networks:
      - autodeal-net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://autodeal:${DB_PASSWORD}@postgres:5432/autodeal}
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - autodeal-net

volumes:
  pgdata:

networks:
  autodeal-net:
    driver: bridge
