[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: integration tests (database, scrapers)
    e2e: end-to-end flows
    compat_placeholder: legacy app._compat placeholder tests
addopts =
    -ra
    --strict-markers
    -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
