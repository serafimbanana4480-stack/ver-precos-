[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: integration tests (database, scrapers)
    e2e: end-to-end flows
    compat_placeholder: legacy app._compat placeholder tests
addopts =
    -ra
    --strict-markers
    -p no:cacheprovider
    # seleniumbase é usado como LIBRARY runtime (scrapers/managed_client.py),
    # mas o PLUGIN pytest instala handlers SIGINT/CTRL_C que matam a sessão
    # (KeyboardInterrupt em asyncio.run) — ver test_health_scheduler_runtime.
    -p no:seleniumbase
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
