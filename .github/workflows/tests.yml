name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black mypy
    - name: Lint (flake8)
      run: flake8 . --max-line-length=120
    - name: Format (black)
      run: black --check . --diff
    - name: Type check (mypy)
      run: mypy . --strict --ignore-missing-imports || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autodeal_test
          POSTGRES_USER: autodeal
          POSTGRES_PASSWORD: autodeal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov pytest-mock factory-boy
    - name: Install Playwright browsers
      run: |
        playwright install chromium --with-deps
    - name: Run unit tests (+ coverage)
      run: pytest tests/unit/ -v --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=55 --timeout=60
    - name: Upload coverage artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: coverage.xml
    - name: Run integration tests
      run: pytest tests/integration/ -v --timeout=120
      env:
        DATABASE_URL: postgresql://autodeal:***@localhost:5432/autodeal_test
